name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 비밀 키 검사 (gitleaks, 이 PR의 커밋만)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" .

      - name: 1MB 넘는 파일 차단
        run: |
          big=$(find . -path ./.git -prune -o -type f -size +1024k -print)
          if [ -n "$big" ]; then echo "1MB 넘는 파일:"; echo "$big"; exit 1; fi

      - name: 노트북 셀 출력 제거 확인
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys
          bad = [str(p) for p in pathlib.Path('.').rglob('*.ipynb')
                 if '.git' not in p.parts
                 and any(c.get('outputs') or c.get('execution_count') for c in json.loads(p.read_text())['cells'])]
          if bad:
              sys.exit('셀 출력이 남은 노트북: ' + ', '.join(bad))
          EOF

      - name: 파이썬 코드 검사 (ruff)
        run: |
          pipx run ruff==0.16.9 check .
          pipx run ruff==0.16.9 format --check .

  test:
    # DB 테스트(TEST_DATABASE_URL이 있어야 도는 테스트)까지 실행. 로컬 검증과 같은 PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/signal_test
      UV_VERSION: 0.11.2
    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        run: pipx install "uv==${UV_VERSION}"

      - name: 의존성 설치 (uv.lock 그대로)
        run: uv sync --locked

      - name: 테스트 (pytest, DB 테스트 포함)
        run: uv run pytest -q -rs
