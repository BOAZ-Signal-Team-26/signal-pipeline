name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 비밀 키 검사 (gitleaks, 이 PR의 커밋만)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" .

      - name: 1MB 넘는 파일 차단
        run: |
          big=$(find . -path ./.git -prune -o -type f -size +1024k -print)
          if [ -n "$big" ]; then echo "1MB 넘는 파일:"; echo "$big"; exit 1; fi

      - name: 노트북 셀 출력 제거 확인
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys
          bad = [str(p) for p in pathlib.Path('.').rglob('*.ipynb')
                 if '.git' not in p.parts
                 and any(c.get('outputs') or c.get('execution_count') for c in json.loads(p.read_text())['cells'])]
          if bad:
              sys.exit('셀 출력이 남은 노트북: ' + ', '.join(bad))
          EOF

      - name: 파이썬 코드 검사 (ruff)
        run: |
          pipx run ruff==0.16.9 check .
          pipx run ruff==0.16.9 format --check .

      - name: 마이그레이션 SQL 검사 (Squawk, 이 PR에서 추가·수정한 파일만)
        # 설정은 .squawk.toml. 이름만 바뀐 파일(내용 같음)은 검사하지 않는다
        # 체크아웃된 HEAD는 PR 병합 결과다. head 브랜치 끝점과 비교하면 dev에 먼저 들어온 변경까지 잡히므로 HEAD와 비교한다
        env:
          SQUAWK_VERSION: 2.73.0
        run: |
          files=$(git diff --name-only --diff-filter=AM \
            "${{ github.event.pull_request.base.sha }}" HEAD \
            -- 'db/migrations/*.sql')
          if [ -z "$files" ]; then echo "바뀐 마이그레이션 파일 없음"; exit 0; fi
          echo "$files"
          # shellcheck disable=SC2086
          npx --yes "squawk-cli@${SQUAWK_VERSION}" $files

  test:
    # DB 테스트(TEST_DATABASE_URL이 있어야 도는 테스트)까지 실행. 로컬 검증과 같은 PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: signal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/signal_test
      UV_VERSION: 0.11.2
    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        run: pipx install "uv==${UV_VERSION}"

      - name: 의존성 설치 (uv.lock 그대로)
        run: uv sync --locked

      - name: 마이그레이션 확인 (DB 소유자 signal_owner로 Flyway migrate 2회·validate·info, 소유자 확인)
        # RDS와 같은 조건으로 적용한다. 마이그레이션 계정 signal_owner는 슈퍼유저·DB 생성·역할 생성 권한이 없고 signal DB의 소유자다(docs/data-model.md 「운영 규칙」)
        # 테스트가 쓰는 signal_test와 겹치지 않게 별도 DB signal에 적용한다. 역할·DB 생성과 소유자 확인은 서비스 컨테이너 안에서 postgres 슈퍼유저로 한다
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          FLYWAY_IMAGE: redgate/flyway:13.13.0
          FLYWAY_URL: jdbc:postgresql://localhost:5432/signal
          FLYWAY_USER: signal_owner
          FLYWAY_PASSWORD: signal_owner
        run: |
          psql_admin() { docker exec "$PG_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -qtA "$@"; }
          flyway() {
            docker run --rm --network host -v "$PWD:/repo" -w /repo \
              -e FLYWAY_URL -e FLYWAY_USER -e FLYWAY_PASSWORD "$FLYWAY_IMAGE" "$@"
          }

          psql_admin -c "create role signal_owner login password '${FLYWAY_PASSWORD}' nosuperuser nocreatedb nocreaterole"
          psql_admin -c "create database signal owner signal_owner"

          flyway migrate
          # 두 번째 migrate는 적용할 것이 없어야 한다
          second=$(flyway -outputType=json migrate)
          echo "$second"
          executed=$(echo "$second" | jq -r '.migrationsExecuted')
          if [ "$executed" != "0" ]; then echo "두 번째 migrate가 ${executed}건을 적용함"; exit 1; fi
          flyway validate
          flyway info

          # 세 스키마와 그 안의 표·뷰·시퀀스, 이력 표의 소유자가 모두 signal_owner인지 본다
          schemas=$(psql_admin -d signal -c "select count(*) from pg_namespace where nspname in ('raw', 'staging', 'mart')")
          tables=$(psql_admin -d signal -c "select count(*) from pg_tables where schemaname in ('raw', 'staging', 'mart')")
          echo "스키마 ${schemas}개, 표 ${tables}개"
          if [ "$schemas" != "3" ] || [ "$tables" = "0" ]; then echo "스키마나 표가 만들어지지 않음"; exit 1; fi
          not_owned=$(psql_admin -d signal -c "
            select 'schema ' || nspname from pg_namespace
            where nspname in ('raw', 'staging', 'mart') and pg_get_userbyid(nspowner) <> 'signal_owner'
            union all
            select 'relation ' || n.nspname || '.' || c.relname
            from pg_class c join pg_namespace n on n.oid = c.relnamespace
            where (n.nspname in ('raw', 'staging', 'mart') or (n.nspname = 'public' and c.relname = 'flyway_schema_history'))
              and c.relkind in ('r', 'p', 'v', 'm', 'S')
              and pg_get_userbyid(c.relowner) <> 'signal_owner'")
          if [ -n "$not_owned" ]; then echo "signal_owner가 소유하지 않은 객체:"; echo "$not_owned"; exit 1; fi
          echo "스키마·표·뷰·시퀀스·이력 표 소유자 모두 signal_owner"

      - name: 테스트 (pytest, DB 테스트 포함)
        run: uv run pytest -q -rs
