[project]
name = "signal-pipeline"
version = "0.1.0"
description = "BOAZ Signal 투자설명서 수집·파싱·채점·추출 파이프라인"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.13"]
build-backend = "uv_build"

[tool.ruff]
# 조사용 스크립트(research/)는 실측 기록이라 검사 대상에서 뺌
extend-exclude = ["research"]
# pre-commit은 파일 경로를 직접 넘기므로 이 설정이 있어야 위 제외가 적용됨
force-exclude = true
